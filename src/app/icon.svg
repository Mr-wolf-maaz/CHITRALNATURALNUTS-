<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chitral Natural Nuts logo">
  <defs>
    <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f5233;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a3d1f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle background -->
  <circle cx="256" cy="256" r="256" fill="#f5f5f0"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#1f5233" stroke-width="12"/>
  
  <!-- Inner circle for nuts -->
  <circle cx="256" cy="256" r="150" fill="url(#innerGrad)" stroke="#fcd34d" stroke-width="8"/>
  
  <!-- Walnuts -->
  <ellipse cx="210" cy="210" rx="26" ry="35" fill="#6b4423" opacity="0.9"/>
  <ellipse cx="235" cy="225" rx="24" ry="32" fill="#8b5a3c" opacity="0.85"/>
  
  <!-- Pistachios -->
  <ellipse cx="320" cy="190" rx="20" ry="28" fill="#d4af37" opacity="0.95" transform="rotate(-25 320 190)"/>
  <ellipse cx="345" cy="205" rx="18" ry="26" fill="#ffd700" opacity="0.9" transform="rotate(20 345 205)"/>
  <ellipse cx="330" cy="230" rx="17" ry="24" fill="#daa520" opacity="0.85" transform="rotate(-40 330 230)"/>
  
  <!-- Apricots -->
  <circle cx="250" cy="260" r="22" fill="#d2691e" opacity="0.9"/>
  <circle cx="285" cy="250" r="24" fill="#cd853f" opacity="0.85"/>
  <circle cx="295" cy="285" r="20" fill="#c87333" opacity="0.8"/>
  
  <!-- Almonds -->
  <ellipse cx="360" cy="270" rx="18" ry="30" fill="#d4a574" opacity="0.9" transform="rotate(35 360 270)"/>
  <ellipse cx="345" cy="310" rx="16" ry="28" fill="#c19a6b" opacity="0.8" transform="rotate(-15 345 310)"/>
  
  <!-- More nuts for fullness -->
  <ellipse cx="180" cy="280" rx="18" ry="26" fill="#8b6914" opacity="0.85" transform="rotate(-35 180 280)"/>
  <ellipse cx="195" cy="320" rx="16" ry="24" fill="#704214" opacity="0.75" transform="rotate(20 195 320)"/>
</svg>
